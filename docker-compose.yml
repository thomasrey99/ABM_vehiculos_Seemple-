version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abm-app
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./ABM_backend/.env:/app/backend/.env:ro
      - ./ABM_AI_service/.env:/app/ai-service/.env:ro
      - ./ABM_backend/credentials/google_cloud_credentials.json:/app/backend/credentials/google_cloud_credentials.json:ro
    restart: unless-stopped